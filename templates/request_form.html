<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Reservation Request - HPC Esprit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-esprit">
    <div class="container">
      <a class="navbar-brand" href="/dashboard">HPC <span>ESPRIT</span></a>
      <div class="ms-auto text-white">
        {{ user.username }} ({{ user.role }})
        <a href="/logout" class="btn btn-sm btn-esprit-red ms-2">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card-esprit p-4">
          <h2 class="mb-4">New Reservation Request</h2>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Job Name</label>
              <input type="text" name="job_name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">CPU Cores</label>
              <input type="number" name="cpu" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">RAM (GB)</label>
              <input type="number" name="ram" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Duration (hours)</label>
              <input type="number" name="duration" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Slurm Script (optional)</label>
              <textarea name="script" class="form-control" rows="6" placeholder="#!/bin/bash&#10;#SBATCH ..."></textarea>
              <small>If left empty, a default script will be used.</small>
            </div>
            <button type="submit" class="btn btn-esprit-red me-2">Submit Request</button>
            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; HPC Esprit
  </footer>
</body>
</html>
