<!DOCTYPE html>
<html>
<head>
    <title>New Reservation Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>New Reservation Request</h2>
    <form method="post">
        <div class="mb-3">
            <label>Job Name</label>
            <input type="text" name="job_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>CPU Cores</label>
            <input type="number" name="cpu" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>RAM (GB)</label>
            <input type="number" name="ram" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Duration (hours)</label>
            <input type="number" name="duration" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Slurm Script (optional)</label>
            <textarea name="script" class="form-control" rows="6" placeholder="#!/bin/bash&#10;#SBATCH ..."></textarea>
            <small>If left empty, a default script will be used.</small>
        </div>
        <button type="submit" class="btn btn-primary">Submit Request</button>
        <a href="/dashboard" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
