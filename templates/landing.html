<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to HPC Esprit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --esprit-red: #c8102e;
            --esprit-black: #1a1a1a;
            --esprit-white: #ffffff;
        }
        body {
            background-color: var(--esprit-black);
            color: var(--esprit-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .brand-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--esprit-red);
            margin-bottom: 0.5rem;
        }
        .brand-subtitle {
            font-size: 1.25rem;
            color: var(--esprit-white);
            margin-bottom: 2rem;
        }
        .btn-esprite-red {
            background-color: var(--esprit-red);
            border: none;
            color: var(--esprit-white);
            padding: 0.75rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 0;
        }
        .btn-esprite-red:hover {
            background-color: #a00c26;
            color: var(--esprit-white);
        }
        .status-card {
            background-color: var(--esprit-white);
            color: var(--esprit-black);
            border-top: 4px solid var(--esprit-red);
            padding: 1.5rem;
            margin-top: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .status-label {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-up {
            color: #198754;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .status-down {
            color: var(--esprit-red);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .contact-note {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #cccccc;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #888888;
            font-size: 0.85rem;
        }
        a {
            color: var(--esprit-white);
            text-decoration: underline;
        }
        a:hover {
            color: var(--esprit-red);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1 class="brand-title">Welcome to HPC Esprit</h1>
            <p class="brand-subtitle">High Performance Computing Reservation Portal</p>

            <a href="/login" class="btn btn-esprite-red">Login</a>

            <div class="status-card">
                <div class="status-label">Server Status</div>
                {% if overall_up %}
                <div class="status-up">UP</div>
                <div>All services are operational.</div>
                {% else %}
                <div class="status-down">DOWN</div>
                <div>{{ downtime_message }}</div>
                {% endif %}
            </div>

            <p class="contact-note">
                To request an account, please contact the Esprit administration.
            </p>
        </div>
    </div>

    <footer>
        &copy; HPC Esprit
    </footer>
</body>
</html>
