<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to HPC Esprit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <div class="hero-landing">
    <div class="container">
      <h1 class="display-3 fw-bold">Welcome to HPC Esprit</h1>
      <p class="lead mb-4">High Performance Computing Reservation Portal</p>

      <a href="/login" class="btn btn-esprit-red btn-lg">Login</a>

      <div class="card-esprit p-4 mt-5" style="max-width: 500px; margin: 2rem auto 0;">
        <div class="status-indicator {{ 'status-down' if not overall_up else 'status-up' }}">
          {{ 'DOWN' if not overall_up else 'UP' }}
        </div>
        <p class="mt-3 mb-0">{{ downtime_message }}</p>
      </div>

      <p class="mt-4 text-muted">
        To request an account, please contact the <a href="#">Esprit administration</a>.
      </p>
    </div>
  </div>

  <footer class="site-footer">
    &copy; HPC Esprit
  </footer>
</body>
</html>
