<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor - {{ reservation.language|title }} Session - HPC Esprit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="/static/style.css" rel="stylesheet">
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
  <style>
    #editor { height: 420px; border: 1px solid #ccc; }
    #output { min-height: 120px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-esprit">
    <div class="container">
      <a class="navbar-brand" href="/dashboard">HPC <span>ESPRIT</span></a>
      <div class="ms-auto text-white">
        {{ user.username }} ({{ user.role }})
        <a href="/logout" class="btn btn-sm btn-esprit-red ms-2">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>{{ reservation.language|title }} Editor</h2>
      <div>
        <span id="timer" class="badge bg-dark fs-6">00:00:00</span>
        <form method="post" action="/editor/{{ reservation.id }}/stop" style="display:inline;" onsubmit="return confirm('End this editor session?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
          <button type="submit" class="btn btn-warning ms-2">Stop</button>
        </form>
        <button id="runBtn" class="btn btn-esprit-red ms-2">Run</button>
        <a href="/dashboard" class="btn btn-secondary ms-2">Exit</a>
      </div>
    </div>
    <div id="editor"></div>
    <div class="mt-3">
      <h5>Output</h5>
      <pre id="output" class="p-3 bg-light border">Ready. Write code and click Run.</pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  <script>
    (function() {
      try {
        if (typeof self !== 'undefined' && !self.MonacoEnvironment) {
          self.MonacoEnvironment = {
            getWorkerUrl: function(workerId, label) {
              return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                "self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };" +
                "importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.js');"
              );
            }
          };
        }
      } catch (e) {
        console.error('MonacoEnvironment setup failed:', e);
      }
    })();
  </script>
  <script>
    const reservationId = "{{ reservation.id }}";
    const language = "{{ reservation.language }}";
    const totalSeconds = {{ remaining_seconds }};
    let editor = null;

    function initMonaco() {
      if (typeof require === 'undefined') {
        console.warn('Monaco loader not available, using fallback textarea');
        document.getElementById('editor').innerHTML = '<textarea id="codeFallback" class="form-control font-monospace" rows="12" style="width:100%;height:420px;">{{ reservation.code or '' }}</textarea>';
        return;
      }
      try {
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
          const langMap = { python: 'python', java: 'java', c: 'cpp' };
          editor = monaco.editor.create(document.getElementById('editor'), {
            value: `{{ reservation.code or '' }}`,
            language: langMap[language] || 'python',
            theme: 'vs-dark',
            automaticLayout: true,
          });
          console.log('Monaco initialized successfully');
        });
      } catch (e) {
        console.error('Failed to init Monaco:', e);
        document.getElementById('editor').innerHTML = '<textarea id="codeFallback" class="form-control font-monospace" rows="12" style="width:100%;height:420px;">{{ reservation.code or '' }}</textarea>';
      }
    }

    function getCode() {
      if (editor) return editor.getValue();
      const fb = document.getElementById('codeFallback');
      return fb ? fb.value : '';
    }

    initMonaco();

    startTimer();

    function startTimer() {
      let timeLeft = totalSeconds;
      const timerEl = document.getElementById('timer');
      const interval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(interval);
          timerEl.textContent = 'EXPIRED';
          const runBtn = document.getElementById('runBtn');
          if (runBtn) runBtn.disabled = true;
          return;
        }
        timeLeft--;
        const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
        const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        timerEl.textContent = `${h}:${m}:${s}`;
      }, 1000);
    }

    const runBtn = document.getElementById('runBtn');
    if (runBtn) {
      runBtn.addEventListener('click', async () => {
        const outputEl = document.getElementById('output');
        outputEl.textContent = 'Submitting...';
        try {
          const form = new FormData();
          form.append('code', getCode());
          const csrfMatch = document.cookie.match(/(?:^|; )csrf_token=([^;]+)/);
          if (csrfMatch) {
            form.append('csrf_token', decodeURIComponent(csrfMatch[1]));
          }
          const res = await fetch(`/editor/{{ reservation.id }}/run`, { method: 'POST', body: form });
          if (res.ok) {
            outputEl.textContent = 'Job submitted, waiting for output...';
            pollOutput();
          } else {
            outputEl.textContent = 'Error: ' + res.statusText;
          }
        } catch (e) {
          outputEl.textContent = 'Run error: ' + e.message;
        }
      });
    }

    async function pollOutput() {
      const outputEl = document.getElementById('output');
      for (let i = 0; i < 30; i++) {
        try {
          const r = await fetch(`/editor/{{ reservation.id }}/status`);
          const data = await r.json();
          if (data.output) outputEl.textContent = data.output;
          if (data.status === 'completed' || data.status === 'failed') break;
        } catch (e) {
          outputEl.textContent = 'Polling error: ' + e.message;
          break;
        }
        await new Promise(res => setTimeout(res, 2000));
      }
    }
  </script>
</body>
</html>
